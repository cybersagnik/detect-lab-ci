title: Certutil Deobfuscation or URLcache Abuse
id: c2e6b9d4-3f8a-4b7c-d1e5-8a2c5f9b3d6e
status: test
description: >
  Detects certutil.exe used to decode Base64 content or download files
  via URLcache. Common technique to stage payloads while evading detection.
references:
  - https://attack.mitre.org/techniques/T1140/
author: Sagnik Ray
date: 2025/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-decode'
      - '-urlcache'
      - '-split'
      - '-f http'
  condition: selection
falsepositives:
  - Legitimate certificate management using certutil
level: high
tags:
  - attack.stealth
  - attack.t1140