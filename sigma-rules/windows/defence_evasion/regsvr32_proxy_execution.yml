title: Regsvr32 Proxy Execution
id: f3a8c1d2-9e4b-4f7a-b2c5-1d8e3f6a9b2c
status: test
description: >
  Detects use of regsvr32.exe to proxy execution of malicious code via
  COM scriptlets or remote .sct files. Commonly used to bypass AppLocker
  and application whitelisting.
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Sagnik Ray
date: 2025/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - 'http'
      - 'scrobj'
      - '/i:'
      - '-i:'
  filter_legitimate:
    CommandLine|endswith:
      - '.dll'
      - '.ocx'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate software registration using /i flag
level: high
tags:
  - attack.stealth
  - attack.t1218.010