title: Process Discovery via tasklist.exe
id: a9c4f7b2-1d6e-4f5a-b8c3-6e9f2a5c8b3d
status: test
description: >
  Detects use of tasklist.exe for process enumeration. Often used
  by adversaries to identify security tools and AV processes before
  attempting to disable them.
references:
  - https://attack.mitre.org/techniques/T1057/
author: Sagnik Ray
date: 2025/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tasklist.exe'
  filter_ui:
    ParentImage|endswith: '\explorer.exe'
  condition: selection and not filter_ui
falsepositives:
  - Legitimate admin scripts enumerating processes
level: low
tags:
  - attack.discovery
  - attack.t1057