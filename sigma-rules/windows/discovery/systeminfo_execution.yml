title: System Information Discovery via systeminfo.exe
id: f8b3e6a1-9c5d-4e4f-a7b2-5d8e1f4c7a2b
status: test
description: >
  Detects execution of systeminfo.exe commonly used by adversaries to
  enumerate system information post-compromise.
references:
  - https://attack.mitre.org/techniques/T1082/
author: Sagnik Ray
date: 2025/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\systeminfo.exe'
  filter_legitimate:
    ParentImage|endswith:
      - '\msiexec.exe'
      - '\setup.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate admin scripts inventorying systems
  - Helpdesk and support tools
level: low
tags:
  - attack.discovery
  - attack.t1082