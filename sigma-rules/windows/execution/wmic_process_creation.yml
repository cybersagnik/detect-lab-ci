title: WMIC Remote Process Creation
id: b4d7a2c9-5e1f-4a8b-c3d6-9f2e5a8c3b6d
status: test
description: >
  Detects use of wmic.exe to create processes locally or remotely.
  Used by adversaries for lateral movement and command execution.
references:
  - https://attack.mitre.org/techniques/T1047/
author: Sagnik Ray
date: 2025/07/01
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'process'
      - 'call'
      - 'create'
  filter_legitimate:
    CommandLine|contains:
      - 'Win32_Processor'
      - 'Win32_ComputerSystem'
      - 'Win32_OperatingSystem'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate WMI-based management and monitoring tools
level: medium
tags:
  - attack.execution
  - attack.t1047